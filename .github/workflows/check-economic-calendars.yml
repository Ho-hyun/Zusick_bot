name: Check Economic Calendar Access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2
      - name: Check public calendar endpoints
        run: |
          python - <<'PY'
          import requests
          urls = {
              'BLS ICS': 'https://www.bls.gov/schedule/news_release/bls.ics',
              'BLS HTML': 'https://www.bls.gov/schedule/2026/11_sched_list.htm',
              'NY Fed calendar': 'https://www.newyorkfed.org/research/calendars/i-nov26.html',
              'FRED calendar': 'https://fred.stlouisfed.org/releases/calendar?d=2026-11-17&view=day',
          }
          for name, url in urls.items():
              try:
                  response = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'}, timeout=15)
                  body = response.text
                  print(name, 'HTTP', response.status_code, 'bytes', len(response.content),
                        'CPI:', 'Consumer Price' in body, 'jobs:', 'Employment Situation' in body)
              except Exception as error:
                  print(name, type(error).__name__)
          PY
