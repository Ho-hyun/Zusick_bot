name: Telegram Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not token or not chat_id:
              print("실패: TELEGRAM_BOT_TOKEN 또는 TELEGRAM_CHAT_ID가 없습니다.")
              raise SystemExit(1)

          message = (
              "✅ 미국장 브리핑 봇 연결 성공!\n\n"
              "예정된 분석 범위:\n"
              "• S&P 500 시장 동향\n"
              "• 반도체·AI 주요 뉴스\n"
              "• SOXL 동향\n"
              "• 급등락 종목 및 실적\n"
              "• 주간 이슈와 다음 주 일정\n\n"
              "이 메시지는 연결 테스트입니다."
          )

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": message,
          }).encode("utf-8")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              if not result.get("ok"):
                  print("실패: Telegram이 발송을 승인하지 않았습니다.")
                  raise SystemExit(1)
          except urllib.error.HTTPError as error:
              print(f"실패: Telegram HTTP 오류 {error.code}")
              raise SystemExit(1)
          except Exception:
              print("실패: 네트워크 또는 응답 처리 오류입니다.")
              raise SystemExit(1)

          print("성공: Telegram 테스트 메시지를 보냈습니다.")
          PY
