          cat > macro_data.py <<'PY_MACRO_DATA'
          """Latest public BLS observations; consensus forecasts are never invented.

          This is a retrieval snapshot, not a historical/vintage-data service. Series
          periods are observation months, not release dates. Normal use passes current
          run time as ``asof``; old requested dates are rejected to prevent look-ahead.
          """
          from __future__ import annotations

          from datetime import datetime, timezone
          from decimal import Decimal, InvalidOperation, ROUND_HALF_UP
          import re
          from zoneinfo import ZoneInfo

          import requests

          ENDPOINT = 'https://api.bls.gov/publicAPI/v1/timeseries/data/'
          CPI_SERIES = 'CUUR0000SA0'
          CPI_SA_SERIES = 'CUSR0000SA0'
          UNEMPLOYMENT_SERIES = 'LNS14000000'
          NY = ZoneInfo('America/New_York')


          def _previous_month(period: str) -> str:
              year, month = map(int, period.split('-'))
              return f'{year - (month == 1):04d}-{12 if month == 1 else month - 1:02d}'


          def _monthly_rows(series: dict, latest_allowed: str) -> dict[str, Decimal]:
              output = {}
              for row in series.get('data', []):
                  if not isinstance(row, dict) or not re.fullmatch(r'M(0[1-9]|1[0-2])', str(row.get('period', ''))):
                      continue
                  try:
                      period = f"{int(row['year']):04d}-{int(row['period'][1:]):02d}"
                      value = Decimal(str(row['value']).replace(',', ''))
                      if not value.is_finite() or period > latest_allowed:
                          continue
                  except (ValueError, TypeError, KeyError, InvalidOperation):
                      continue
                  output[period] = value
              return output


          def _rounded(value: Decimal | None) -> float | None:
              if value is None or not value.is_finite():
                  return None
              return float(value.quantize(Decimal('0.1'), rounding=ROUND_HALF_UP))


          def _yoy(rows: dict[str, Decimal], period: str) -> float | None:
              year, month = map(int, period.split('-'))
              previous_year = f'{year - 1:04d}-{month:02d}'
              current, base = rows.get(period), rows.get(previous_year)
              if current is None or base is None or current <= 0 or base <= 0:
                  return None
              return _rounded((current / base - 1) * 100)


          def _mom(rows, period):
              current, base = rows.get(period), rows.get(_previous_month(period))
              if current is None or base is None or base <= 0:
                  return None
              return _rounded((current / base - 1) * 100)


          def _empty(series: str, title: str, unit: str, basis: str) -> dict:
              return {
                  'title': title, 'series_id': series, 'actual': None, 'previous': None,
                  'forecast': None, 'forecast_label': '미확인', 'period': None,
                  'previous_period': None, 'unit': unit, 'frequency': 'monthly',
                  'basis': basis, 'source': ENDPOINT + series,
                  'notes': ['시장 예상치는 BLS 실제 관측값 API에 포함되지 않아 미확인으로 표시합니다.'],
              }


          def parse_bls(payload: dict, asof: datetime) -> dict:
              """Parse current published observations; exclude annual and future months."""
              if asof.tzinfo is None or asof.utcoffset() is None:
                  raise ValueError('asof must have a timezone')
              max_period = _previous_month(asof.astimezone(NY).strftime('%Y-%m'))
              result = {
                  'cpi': _empty(CPI_SERIES, '미국 소비자물가지수(CPI)', '% YoY', 'CPI-U 전체 품목·비계절조정 지수의 전년 동월 대비'),
                  'unemployment': _empty(UNEMPLOYMENT_SERIES, '미국 실업률', '%', '계절조정 실업률'),
                  'warnings': [],
              }
              if not isinstance(payload, dict) or payload.get('status') != 'REQUEST_SUCCEEDED':
                  result['warnings'].append('BLS 경제지표 API가 자료를 제공하지 못했습니다. 한도 또는 응답 상태를 확인하세요.')
                  return result
              contents = payload.get('Results', {})
              series_list = contents.get('series', []) if isinstance(contents, dict) else []
              lookup = {row.get('seriesID'): row for row in series_list if isinstance(row, dict)}
              for key, identifier in [('cpi', CPI_SERIES), ('unemployment', UNEMPLOYMENT_SERIES)]:
                  rows = _monthly_rows(lookup.get(identifier, {}), max_period)
                  metric = result[key]
                  if not rows:
                      result['warnings'].append(metric['title'] + ': 확인 가능한 월간 관측값이 없습니다.')
                      continue
                  period = max(rows)
                  previous = _previous_month(period)
                  metric.update(period=period, previous_period=previous)
                  if key == 'cpi':
                      metric['actual'] = _yoy(rows, period)
                      metric['previous'] = _yoy(rows, previous)
                      computable = [value for value in sorted(rows, reverse=True) if _yoy(rows, value) is not None]
                      if computable:
                          latest_yoy_period = computable[0]
                          prior_yoy_period = _previous_month(latest_yoy_period)
                          metric['latest_available_yoy'] = {
                              'actual': _yoy(rows, latest_yoy_period),
                              'previous': _yoy(rows, prior_yoy_period),
                              'forecast': None, 'period': latest_yoy_period,
                              'previous_period': prior_yoy_period,
                              'unit': '% YoY', 'source': metric['source'],
                          }
                      if metric['actual'] is None:
                          result['warnings'].append('CPI 전년 동월 비교에 필요한 지수가 부족하여 상승률을 계산하지 않았습니다.')
                          if computable:
                              metric['notes'].append('최근 계산 가능한 전년 동월비는 ' + computable[0] + ' 기준입니다. 최신 지수 관측 월과 구분하세요.')
                  else:
                      metric['actual'] = _rounded(rows[period])
                      metric['previous'] = _rounded(rows.get(previous))
                  if metric['previous'] is None:
                      metric['notes'].append('직전 월 비교값은 확인되지 않았습니다.')
                  metric['notes'].append('이전값은 현재 API의 직전 월 관측값으로, 당시 최초 발표값과 다를 수 있습니다.')
              sa_rows = _monthly_rows(lookup.get(CPI_SA_SERIES, {}), max_period)
              if sa_rows:
                  period = max(sa_rows)
                  previous = _previous_month(period)
                  result['cpi']['mom'] = {'period': period, 'previous_period': previous, 'actual': _mom(sa_rows, period), 'previous': _mom(sa_rows, previous), 'forecast': None, 'unit': '% MoM SA', 'source': ENDPOINT + CPI_SA_SERIES}
              return result


          def collect_macro(asof: datetime) -> dict:
              """One no-key BLS v1 request returns two monthly macro series.

              Request count is one, with two preceding calendar years retained to compute
              the latest and previous CPI YoY rates even near January. Never interpret a
              monthly observation date as a release date or an intraday measurement.
              """
              if asof.tzinfo is None or asof.utcoffset() is None:
                  raise ValueError('asof must have a timezone')
              now = datetime.now(timezone.utc)
              if now.astimezone(NY).date() != asof.astimezone(NY).date():
                  result = parse_bls({'status': 'REQUEST_SUCCEEDED', 'Results': {'series': []}}, asof)
                  result['warnings'] = ['BLS 최신 API는 과거 공표 시점 재현을 보장하지 않아 오래된 기준 시각에는 현재 자료를 사용하지 않습니다.']
                  result.update(requested_asof=asof.isoformat(), retrieved_at=now.isoformat(), snapshot_basis='latest-published-only')
                  return result
              year = now.astimezone(NY).year
              payload = {'seriesid': [CPI_SERIES, CPI_SA_SERIES, UNEMPLOYMENT_SERIES],
                         'startyear': str(year - 2), 'endyear': str(year)}
              try:
                  response = requests.post(ENDPOINT, json=payload,
                                           headers={'User-Agent': 'Mozilla/5.0 (PersonalMarketBriefing/1.0)'}, timeout=(5, 12))
                  response.raise_for_status()
                  result = parse_bls(response.json(), asof)
              except requests.HTTPError as error:
                  status = error.response.status_code if error.response is not None else '미확인'
                  result = parse_bls({}, asof)
                  result['warnings'] = ['BLS 월간 경제지표 HTTP ' + str(status) + ': CPI·실업률 값 미확인']
              except (requests.RequestException, ValueError, TypeError, AttributeError):
                  result = parse_bls({}, asof)
                  result['warnings'] = ['BLS 월간 경제지표 연결 또는 응답 형식 오류: CPI·실업률 값 미확인']
              result.update(requested_asof=asof.isoformat(), retrieved_at=now.isoformat(), snapshot_basis='latest-published-only')
              result['notes'] = ['현재 조회한 최신 공표값입니다. API에 발표 시각이 없어 과거 시점의 공표 여부를 재현하는 용도로 사용하지 않습니다.']
              return result

