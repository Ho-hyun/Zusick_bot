          cat > macro_card.py <<'PY_MACRO_CARD'
          """Render a Korean financial summary card without image-generation APIs.

          Quote contract: ^TNX.close is a yield in percent (4.15 means 4.15%).
          CL=F is the Yahoo front-month WTI futures series, not a spot oil price.
          Missing Korean fonts raise an error so callers can send their text fallback.
          """
          from __future__ import annotations

          from datetime import datetime
          import html
          import json
          import math
          import os
          from pathlib import Path
          import re
          from zoneinfo import ZoneInfo

          from PIL import Image, ImageDraw, ImageFont, PngImagePlugin

          KST = ZoneInfo('Asia/Seoul')
          BG, PANEL, BORDER = '#080d14', '#111a26', '#263445'
          WHITE, MUTED, GREEN, RED = '#eef4fc', '#97a9bf', '#42e697', '#ff727d'


          def finite(value):
              try:
                  result = float(value)
                  return result if math.isfinite(result) else None
              except (ValueError, TypeError):
                  return None


          def number(value, digits=2, suffix='', signed=False):
              value = finite(value)
              if value is None:
                  return '미확인'
              return format(value, ('+' if signed else '') + ',.' + str(digits) + 'f') + suffix


          def rate(value):
              value = finite(value)
              return '미확인' if value is None else f'{value:.2f}'.rstrip('0').rstrip('.') + '%'


          def yield_change(row):
              explicit = finite(row.get('yield_change_pp'))
              if explicit is not None:
                  return explicit
              current, previous = finite(row.get('close')), finite(row.get('previous_close'))
              return current - previous if current is not None and previous is not None else None


          def metric_rows(quotes, session=None):
              rows = []
              for symbol, label, kind, unit in [
                  ('^GSPC', 'S&P 500', 'index', '지수'),
                  ('^IXIC', 'NASDAQ', 'index', '지수'),
                  ('^VIX', 'VIX 변동성 지수', 'index', '지수'),
                  ('^TNX', '미국 10년물 국채금리', 'yield', '%'),
                  ('CL=F', 'WTI 원유선물', 'oil', '달러/배럴'),
                  ('SOXL', '반도체 3배 ETF(SOXL)', 'equity', '달러'),
              ]:
                  record = quotes.get(symbol, {})
                  close = finite(record.get('close'))
                  value = number(close, suffix='%' if kind == 'yield' else '')
                  if kind in ('oil', 'equity') and close is not None:
                      value = '$' + value
                  change = yield_change(record) if kind == 'yield' else finite(record.get('pct'))
                  change_text = number(change, suffix='%p' if kind == 'yield' else '%', signed=True)
                  color = MUTED if change is None or change == 0 else GREEN if change > 0 else RED
                  price_date = str(record.get('price_date') or '')[:10]
                  if price_date and session and price_date != str(session)[:10]:
                      unit = '기준 ' + price_date[5:] + ' · ' + unit
                  rows.append((label, value, change_text, color, unit))
              return rows


          def macro_rows(macro):
              rows = []
              for key, title in [('cpi', '소비자물가지수(CPI) · 전년동월비'), ('unemployment', '실업률 · 계절조정')]:
                  item = macro.get(key) or {}
                  period = item.get('period') or '기준월 미확인'
                  rows.append((title, str(period), '실제 ' + rate(item.get('actual'))
                               + '   |   예상 ' + rate(item.get('forecast'))
                               + '   |   이전월 ' + rate(item.get('previous'))))
              return rows


          def macro_notes(macro, key):
              item = macro.get(key) or {}
              notes = []
              mom = item.get('mom')
              if key == 'cpi' and isinstance(mom, dict) and finite(mom.get('actual')) is not None:
                  notes.append('전월비(계절조정) ' + str(mom.get('period', '')) + ': '
                               + rate(mom['actual']) + ' · 이전월 ' + rate(mom.get('previous')))
              latest = item.get('latest_available_yoy')
              if key == 'cpi' and isinstance(latest, dict):
                  actual = latest.get('actual', latest.get('value'))
                  if finite(actual) is not None and latest.get('period'):
                      notes.append('최근 확인 가능한 전년동월비: '
                                   + str(latest['period']) + ' ' + rate(actual))
              supplied = item.get('note') or item.get('notes')
              if isinstance(supplied, list):
                  supplied = next((value for value in supplied if isinstance(value, str) and value), '')
              if isinstance(supplied, str) and supplied:
                  notes.append(supplied)
              elif key == 'cpi' and item.get('period') and finite(item.get('actual')) is None:
                  notes.append('현재 기준 월의 전년동월비는 미확인입니다.')
              return notes[:3]


          def _plain(value):
              if not isinstance(value, str):
                  return ''
              value = html.unescape(re.sub('<[^>]+>', '', value))
              value = re.sub(r'\s*\[n\d+\]', '', value)
              value = re.sub('[\U0001F000-\U0001FAFF\u200d\ufe0f]', '', value)
              return re.sub(r'\s+', ' ', value).strip()


          def _font_file(explicit=None):
              candidates = [explicit, os.getenv('FONT_PATH'),
                            '/workspace/work/fonts/NotoSansCJKkr-Regular.otf',
                            '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc',
                            '/usr/share/fonts/truetype/noto/NotoSansKR-Regular.ttf']
              for candidate in candidates:
                  if candidate and Path(candidate).is_file():
                      return str(candidate)
              raise FileNotFoundError('요약 카드용 한글 폰트가 없습니다. 텍스트 브리핑을 사용하세요.')


          def _wrap(draw, value, font, width, maximum):
              value = _plain(value)
              if not value:
                  return []
              lines, current = [], ''
              for char in value:
                  if current and draw.textlength(current + char, font=font) > width:
                      lines.append(current.rstrip())
                      current = char.lstrip()
                      if len(lines) == maximum:
                          break
                  else:
                      current += char
              else:
                  if current:
                      lines.append(current.rstrip())
                  return lines[:maximum]
              last = lines[-1]
              while last and draw.textlength(last + '…', font=font) > width:
                  last = last[:-1]
              lines[-1] = last.rstrip() + '…'
              return lines


          def _event_title(value):
              labels = [('consumer price', '미국 소비자물가지수(CPI)'),
                        ('employment situation', '미국 고용보고서'),
                        ('producer price', '미국 생산자물가지수(PPI)'),
                        ('job openings', '미국 구인·이직보고서(JOLTS)'),
                        ('gross domestic', '미국 국내총생산(GDP)'),
                        ('personal income', '미국 개인소득·소비지출'),
                        ('international trade', '미국 무역수지'),
                        ('import', '미국 수입·수출물가')]
              for key, translated in labels:
                  if key in str(value).lower():
                      return translated
              return _plain(value) if re.search('[가-힣]', str(value)) else '주요 경제지표 발표'


          def render_summary_card(data, summary, macro, output_path, font_path=None):
              """Write a 1080px-wide PNG, return its Path. Never calls a model/API."""
              context = data.get('context', data)
              quotes = data.get('quotes', data.get('market', {}).get('quotes', {}))
              summary = summary if isinstance(summary, dict) else {}
              asof = datetime.fromisoformat(context['asof'])
              if asof.tzinfo is None:
                  raise ValueError('카드 기준 시각에는 시간대가 필요합니다.')
              asof = asof.astimezone(KST)
              font_file = _font_file(font_path)
              fonts = {size: ImageFont.truetype(font_file, size) for size in (19, 21, 23, 25, 28, 34, 43)}
              image = Image.new('RGB', (1080, 2400), BG)
              draw = ImageDraw.Draw(image)
              left, right, y = 44, 1036, 35

              def label(value, x, top, size=25, color=WHITE, bold=False):
                  draw.text((x, top), str(value), font=fonts[size], fill=color,
                            anchor='lt', stroke_width=1 if bold else 0, stroke_fill=color)

              def divider(top):
                  draw.line((left, top, right, top), fill=BORDER, width=2)

              label('미국 증시 모닝 브리핑', left, y, 34, bold=True)
              date = f'{asof:%Y.%m.%d}(' + '월화수목금토일'[asof.weekday()] + ')'
              badge = '형식 예시 · 가상 수치' if data.get('example') or context.get('example') else date
              label(badge, right-draw.textlength(badge, font=fonts[21]), y+8, 21, MUTED)
              label('미국 거래일 ' + str(context.get('session', '미확인'))
                    + f'  |  자료 기준 {asof:%H:%M} KST', left, y+59, 21, MUTED)
              y += 115

              gap, tile_width, tile_height = 24, 484, 158
              for index, (name, value, change, color, unit) in enumerate(metric_rows(quotes, context.get('session'))):
                  x = left + (index % 2) * (tile_width+gap)
                  top = y + (index // 2) * (tile_height+20)
                  draw.rounded_rectangle((x, top, x+tile_width, top+tile_height), radius=16,
                                         fill=PANEL, outline=BORDER, width=1)
                  label(name, x+22, top+18, 23, MUTED)
                  label(value, x+22, top+55, 43, bold=True)
                  label(change, x+22, top+115, 23, color)
                  label(unit, x+tile_width-22-draw.textlength(unit, font=fonts[19]), top+119, 19, MUTED)
              y += 3*(tile_height+20)+12
              divider(y)
              y += 28
              label('주요 경제지표', left, y, 28, bold=True)
              label('최신 조회값 · 기준 월 표시', 700, y+6, 19, MUTED)
              y += 51
              for key, (title, period, values) in zip(('cpi', 'unemployment'), macro_rows(macro)):
                  label(title, left, y, 23)
                  label(period, right-draw.textlength(period, font=fonts[21]), y, 21, MUTED)
                  label(values, left, y+38, 25)
                  y += 80
                  for note in macro_notes(macro, key):
                      for line in _wrap(draw, note, fonts[19], right-left, 2):
                          label(line, left, y, 19, MUTED)
                          y += 28
                  y += 15
              y += 8
              divider(y)
              y += 27
              label('다가올 주요 일정', left, y, 28, bold=True)
              y += 53
              events = data.get('events', [])
              if isinstance(events, dict):
                  events = events.get('events', [])
              if not events:
                  label('확인된 일정 없음 · 수집 제한 시 본문 안내를 확인하세요.', left, y, 23, MUTED)
                  y += 48
              for item in events[:3]:
                  when = item.get('time') or item.get('time_kst') or (str(item.get('date_us', ''))+' 미국 날짜·한국 시각 미확인')
                  lines = _wrap(draw, str(when)+'  ·  '+_event_title(item.get('title')), fonts[23], right-left, 2)
                  for line in lines:
                      label(line, left, y, 23)
                      y += 35
                  y += 15
              y += 10
              divider(y)
              y += 27
              label('AI 시장 요약', left, y, 28, bold=True)
              y += 53
              overview = _plain(summary.get('overview'))
              if not re.search('[가-힣]', overview):
                  overview = '한국어 AI 요약을 생성하지 못했습니다. 확인된 시장 수치와 원문 링크를 참고하세요.'
              for line in _wrap(draw, overview, fonts[25], right-left, 4):
                  label(line, left, y, 25)
                  y += 39
              y += 26
              divider(y)
              y += 22
              label('시장값: Yahoo Finance 일봉  |  CPI·실업률: BLS', left, y, 19, MUTED)
              label('등락은 전일 대비 · 금리 변화는 %p · WTI는 근월물 선물(달러/배럴)', left, y+31, 19, MUTED)
              label('예상치는 확인된 출처가 없으면 미확인으로 표시합니다.', left, y+62, 19, MUTED)
              height = y+106
              if height > image.height:
                  raise ValueError('요약 카드 내용이 최대 높이를 초과했습니다.')
              image = image.crop((0, 0, 1080, height))
              info = PngImagePlugin.PngInfo()
              info.add_text('report_asof', asof.isoformat())
              info.add_text('us_session', str(context.get('session', '')))
              info.add_text('macro_periods', json.dumps({key: (macro.get(key) or {}).get('period') for key in ('cpi', 'unemployment')}, ensure_ascii=False))
              output = Path(output_path)
              output.parent.mkdir(parents=True, exist_ok=True)
              image.save(output, format='PNG', pnginfo=info, optimize=True)
              return output

