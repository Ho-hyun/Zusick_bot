          def parse_nyfed_html(raw, source, start, end, asof):
              """NY Fed's tentative calendar, restricted to BLS-linked releases."""
              soup = BeautifulSoup(raw, 'html.parser')
              match = re.search('/i-([a-z]{3})(\\d{2})\\.html$', source)
              months = ('jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec')
              if not match or match[1] not in months:
                  raise ValueError('calendar month missing')
              year, month = (2000 + int(match[2]), months.index(match[1]) + 1)
              heading = datetime(year, month, 1).strftime('%B %Y')
              text = soup.get_text(' ', strip=True)
              if heading not in text or not re.search('all Eastern Time', text, re.I):
                  raise ValueError('calendar month/timezone unconfirmed')
              cells = soup.select('table.research-table-1col td.somatdR')
              if not cells:
                  raise ValueError('NY Fed calendar missing')
              rows = []
              for cell in cells:
                  day = re.match('^(\\d{1,2})\\b', cell.get_text(' ', strip=True))
                  if not day:
                      continue
                  for link in cell.select('a[href]'):
                      if not re.match('https?://(?:www\\.)?bls\\.gov/', link['href']):
                          continue
                      title = link.get_text(' ', strip=True)
                      if not (_important(title) or title.upper() == 'JOLTS'):
                          continue
                      following = []
                      for sibling in link.next_siblings:
                          if getattr(sibling, 'name', None) == 'a':
                              break
                          following.append(sibling.get_text(' ', strip=True) if hasattr(sibling, 'get_text') else str(sibling))
