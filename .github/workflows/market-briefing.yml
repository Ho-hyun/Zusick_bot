          def _fetch(url):
              try:
                  response = requests.get(url, headers={'User-Agent': 'Mozilla/5.0'}, timeout=(5, 15))
                  if response.status_code != 200:
                      return (b'', 'HTTP ' + str(response.status_code))
                  if not response.content or len(response.content) > 4000000:
                      return (b'', '빈 응답 또는 크기 제한')
                  return (response.content, '')
