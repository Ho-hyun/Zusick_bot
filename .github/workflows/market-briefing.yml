          def _row(title, when, source, start, end, asof, source_time=''):
              if isinstance(when, datetime) and when.tzinfo:
                  if not start <= when < end or when < asof:
                      return None
                  return {'title': title, 'time': when.astimezone(KST).strftime('%Y-%m-%d %H:%M KST'), 'date_us': when.astimezone(NY).date().isoformat(), 'confirmed_time': True, 'source': source}
              date = when.date() if isinstance(when, datetime) else when
              last_date = (end - timedelta(microseconds=1)).astimezone(NY).date()
              if not max(start.astimezone(NY).date(), asof.astimezone(NY).date()) <= date <= last_date:
                  return None
              label = date.isoformat() + ' 미국 날짜·한국 시각 미확인'
              if source_time:
                  label += ' (원문 시각 ' + source_time + ', 시간대 미확인)'
              return {'title': title, 'time': label, 'date_us': date.isoformat(), 'confirmed_time': False, 'source': source}

          def parse_ics(raw, source, start, end, asof):
              if not raw or b'BEGIN:VCALENDAR' not in raw:
                  raise ValueError('not a calendar')
              rows = []
              for item in Calendar.from_ical(raw).walk('VEVENT'):
                  title = str(item.get('SUMMARY', '')).strip()
                  field = item.get('DTSTART')
                  if not field or not _important(title):
                      continue
                  result = _row(title, field.dt, source, start, end, asof)
                  if result:
                      rows.append(result)
              return rows

          def parse_bls_html(raw, source, start, end, asof):
              soup = BeautifulSoup(raw, 'html.parser')
              tables = soup.select('table.release-list')
              if not tables:
                  raise ValueError('BLS table missing')
              eastern_confirmed = bool(re.search('all times.*eastern', soup.get_text(' ', strip=True), re.I))
              rows, previous_date = ([], None)
              for table in tables:
                  for item in table.select('tbody tr'):
                      date_node, time_node, title_node = (item.select_one(selector) for selector in ('.date-cell', '.time-cell', '.desc-cell'))
                      if not title_node:
                          continue
                      title = title_node.get_text(' ', strip=True)
                      date_text = date_node.get_text(' ', strip=True) if date_node else ''
                      try:
                          date = datetime.strptime(date_text, '%A, %B %d, %Y').date() if date_text else previous_date
                      except ValueError:
                          continue
                      if date is None:
                          continue
                      previous_date = date
                      if not _important(title):
                          continue
                      stamp = time_node.get_text(' ', strip=True) if time_node else ''
                      when = date
                      if eastern_confirmed and stamp:
                          try:
                              clock = datetime.strptime(stamp, '%I:%M %p').time()
                              when = datetime.combine(date, clock, NY)
                          except ValueError:
                              pass
                      result = _row(title, when, source, start, end, asof, stamp if not eastern_confirmed else '')
                      if result:
                          rows.append(result)
