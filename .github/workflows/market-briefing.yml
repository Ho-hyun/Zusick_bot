          cat > macro_quotes.py <<'PY_MACRO_QUOTES'
          """Risk metrics use their own trading dates; ^TNX values are percent yields."""
          import math
          import yfinance as yf


          def parse_metric(frame, symbol, session):
              if frame.empty or 'Close' not in frame:
                  return None
              closes=[]
              for index, raw in frame['Close'].items():
                  stamp=index.date().isoformat()
                  try:
                      value=float(raw)
                  except (ValueError,TypeError):
                      continue
                  if stamp<=session and math.isfinite(value):
                      closes.append((stamp,value))
              if not closes:
                  return None
              closes.sort()
              stamp,value=closes[-1]
              result={'symbol':symbol,'close':value,'price_date':stamp,
                      'unit':'%' if symbol=='^TNX' else 'USD/barrel' if symbol=='CL=F' else 'index',
                      'pct':None}
              if len(closes)>1:
                  previous_stamp,previous=closes[-2]
                  result.update(previous_close=previous,previous_date=previous_stamp)
                  if symbol=='^TNX':
                      result['yield_change_pp']=round(value-previous,4)
                  elif previous>0:
                      result['pct']=round((value/previous-1)*100,2)
              return result


          def collect_risk_quotes(context):
              symbols=['^VIX','^TNX','CL=F']
              quotes,warnings={},[]
              try:
                  raw=yf.download(symbols,period='1mo',group_by='ticker',auto_adjust=False,
                                  prepost=False,progress=False,threads=3,timeout=15)
                  for symbol in symbols:
                      try:
                          record=parse_metric(raw[symbol],symbol,context['session'])
                          if record:
                              quotes[symbol]=record
                          else:
                              warnings.append(symbol+' 기준일 이전 일봉값 미확인')
                      except (KeyError,ValueError,TypeError):
                          warnings.append(symbol+' 시장값 형식 오류')
              except Exception:
                  warnings.append('VIX·미국10년물·WTI 시장값 수집 실패')
              return quotes,warnings

