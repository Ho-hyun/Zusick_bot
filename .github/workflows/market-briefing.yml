name: Build Market Format Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install PyYAML==6.0.3

      - name: Build updated market-briefing.yml
        run: |
          python - .github/workflows/market-briefing.yml artifact/market-briefing.yml <<'PYUPDATE'
          import ast
          from pathlib import Path
          import re
          import textwrap

          HELPERS = '''
          def _market_name(symbol, members):
              symbol=str(symbol or '?')
              names={'NVDA':'엔비디아','AMD':'AMD','AVGO':'브로드컴','TSM':'TSMC','ASML':'ASML','MU':'마이크론','ARM':'암홀딩스','MRVL':'마벨','AMAT':'어플라이드 머티어리얼즈','LRCX':'램리서치','KLAC':'KLA','MSFT':'마이크로소프트','GOOGL':'알파벳','GOOG':'알파벳','AMZN':'아마존','META':'메타','ORCL':'오라클','PLTR':'팔란티어','ANET':'아리스타 네트웍스','DELL':'델 테크놀로지스','SMCI':'슈퍼마이크로컴퓨터','VRT':'버티브','ETN':'이튼','AAPL':'애플','TSLA':'테슬라','SOXL':'반도체 3배 ETF','SOXS':'반도체 인버스 3배 ETF','SOXX':'반도체 ETF','^GSPC':'S&P 500','^IXIC':'나스닥','^DJI':'다우','^SOX':'필라델피아 반도체 지수'}
              name=names.get(symbol) or members.get(symbol) or '기업명 미확인'
              return name if symbol.startswith('^') else name+'('+symbol+')'

          def _market_trend(value):
              try:
                  value=float(value)
                  if not math.isfinite(value): return '❔'
                  return '🚀' if value>=5 else '📈' if value>=1 else '🩸' if value<=-5 else '📉' if value<=-1 else '➖'
              except (ValueError,TypeError): return '❔'

          def _market_label(symbol,members,quotes):
              return _market_trend(quotes.get(symbol,{}).get('pct'))+' '+_market_name(symbol,members)

          def _market_quote(symbol,quotes,members,weekly=False,show_price=True):
              row=quotes[symbol]
              value='<b>'+_e(_market_label(symbol,members,quotes),150)+'</b> '
              if show_price: value+=('' if symbol.startswith('^') else '$')+_number(row.get('close'))+'  '
              value+=_pct(row.get('pct'))
              if weekly and row.get('weekly_pct') is not None: value+=' · 주간 '+_pct(row['weekly_pct'])
              return value

          def _market_roast(data,summary):
              quotes=data.get('quotes',data.get('market',{}).get('quotes',{}))
              market=quotes.get('^GSPC',{}).get('pct')
              sector=quotes.get('^SOX',{}).get('pct')
              soxl=quotes.get('SOXL',{}).get('pct')

              def valid(value):
                  try: return math.isfinite(float(value))
                  except (ValueError,TypeError): return False

              if not valid(market):
                  return '<b>오늘 장 한 줄 평은 휴장합니다. 자료 없이 입만 털 수는 없으니까요. 💤</b>'

              if valid(soxl) and float(soxl)<=-5:
                  fallback='오늘 SOXL은 복리의 마법이었다. 복구에 필요한 수익률만 복리로 불어났다. 🪄🥲'
              elif float(market)<=-1:
                  fallback='오늘 장은 투자 기간을 늘려줬다. 어제까지 단타였는데 오늘부터 가업이다. 🏛️'
              elif valid(sector) and float(sector)>=3 and float(market)<1:
                  fallback='오늘 장은 반도체 회식이었다. 나머지는 계산하고 대리까지 불러줬다. 🧾🥲'
              elif abs(float(market))<0.5:
                  fallback='오늘 장은 전기세 낭비였다. 차트는 제자리인데 내 집중력만 하한가였다. 🔌😵‍💫'
              elif float(market)>0:
                  fallback='오늘 장은 초록불 파티였다. 신중하게 관망했더니 구경값으로 기회비용을 냈다. 🎉🪑'
              else:
                  fallback='오늘 장은 계좌 다이어트였다. 동의한 적도 없는데 숫자부터 가벼워졌다. 🪶🥲'

              line=summary.get('market_roast','')
              if isinstance(line,dict):
                  line=line.get('line','')

              if not isinstance(line,str) or not re.search('[가-힣]',line) or re.search('씨발|시발|새끼|좆|병신|처맞|뒤졌|지랄|존나|염병|fuck|shit|bitch',line,re.I):
                  line=fallback

              line=re.sub(r'\\s+',' ',line).strip()

              if not re.search('[\U0001F300-\U0001FAFF]',line):
                  line+=' 🎭'

              basis='S&P 500 '+_pct(market)
              if valid(sector):
                  basis+=' · 반도체 지수 '+_pct(sector)

              return '<b>'+_e(line,550)+'</b>\\n↳ '+_e(basis,180)
          '''

          PREVIEW = '''
          def _market_preview(message):
              import html,re
              if '<b>② 주요 뉴스</b>' in message:
                  match=re.search(r'<a href="([^"]+)">원문 보기</a>',message)
                  if match:
                      url=html.unescape(match[1])
                      if url.startswith(('https://','http://')):
                          return {'is_disabled':False,'url':url,'prefer_large_media':True,'show_above_text':False}
              return {'is_disabled':True}
          '''

          ROAST_PROMPT = '''
          [오늘 장 한 줄 평]
          JSON에 market_roast 문자열 키를 추가하라.
          실제 지수·반도체·SOXL 움직임을 근거로 '오늘 장은 ...' 형식의 1~2문장을 작성하라.
          친구 단톡방처럼 편하고, 비유와 반전으로 세게 놀리되 욕설·혐오·사람에 대한 모욕은 금지한다.
          예시 말투: '어제까지 단타였는데 오늘부터 가업이다', '엔비디아가 고기 먹고 나머지가 계산한 회식'.
          예시를 매번 복사하지 말고 장 상황에 맞게 바꿔라. 이모지 1~2개. 확인되지 않은 장중 반전이나 개인 보유 종목은 사실처럼 만들지 마라.
          '''

          def patch_layout(code):
              tree=ast.parse(code)

              build=next(
                  n for n in tree.body
                  if isinstance(n,ast.FunctionDef)
                  and n.name=='build_messages'
              )

              quote=next(
                  n for n in build.body
                  if isinstance(n,ast.FunctionDef)
                  and n.name=='quote'
              )

              quote.body=ast.parse(
                  "return _market_quote(symbol,quotes,members,context.get('weekly',False),show_price)"
              ).body

              class Names(ast.NodeTransformer):
                  def visit_Call(self,node):
                      self.generic_visit(node)

                      if isinstance(node.func,ast.Name) and node.func.id=='_e' and node.args:
                          arg=node.args[0]

                          if isinstance(arg,ast.Call) and isinstance(arg.func,ast.Attribute) and isinstance(arg.func.value,ast.Name) and arg.func.value.id=='row' and arg.func.attr=='get' and arg.args and isinstance(arg.args[0],ast.Constant) and arg.args[0].value=='symbol':
                              node.args=[
                                  ast.Call(
                                      func=ast.Name(id='_market_label',ctx=ast.Load()),
                                      args=[
                                          arg,
                                          ast.Name(id='members',ctx=ast.Load()),
                                          ast.Name(id='quotes',ctx=ast.Load())
                                      ],
                                      keywords=[]
                                  ),
                                  ast.Constant(value=160)
                              ]

                      return node

              Names().visit(build)

              pages=next(
                  i for i,n in enumerate(build.body)
                  if isinstance(n,ast.Assign)
                  and any(
                      isinstance(t,ast.Name) and t.id=='pages'
                      for t in n.targets
                  )
              )

              build.body.insert(
                  pages,
                  ast.parse(
                      "groups.append(('⑦ 오늘 장 한 줄 평' if context.get('weekly') else '⑥ 오늘 장 한 줄 평',[_market_roast(data,summary)]))"
                  ).body[0]
              )

              loop=next(
                  n for n in build.body
                  if isinstance(n,ast.For)
                  and isinstance(n.iter,ast.Name)
                  and n.iter.id=='groups'
              )

              branch='''
          if title=='② 주요 뉴스':
              for block in blocks:
                  if _units(block)>budget:
                      plain=_Plain()
                      plain.feed(block)
                      block=_e(''.join(plain.parts),budget-20)
                  pages.append((title,block))
              continue
          '''

              loop.body.insert(
                  0,
                  ast.parse(textwrap.dedent(branch)).body[0]
              )

              tree.body=ast.parse(HELPERS).body+tree.body
              ast.fix_missing_locations(tree)

              return ast.unparse(tree)+'\n'

          def patch_provider(code):
              tree=ast.parse(code)

              for node in ast.walk(tree):
                  if isinstance(node,ast.Constant) and isinstance(node.value,str) and 'weekly_review,next_week.' in node.value:
                      node.value+=' JSON에 market_roast 문자열도 포함. 욕설 없이 비유로 시장을 놀리는 짧은 한 줄 평과 이모지1~2개.'

              return ast.unparse(ast.fix_missing_locations(tree))+'\n'

          def patch_main(code):
              tree=ast.parse(code)

              for node in ast.walk(tree):
                  if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='prompt' for t in node.targets) and isinstance(node.value,ast.Constant):
                      node.value.value+=ROAST_PROMPT

                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr=='post':
                      for kw in node.keywords:
                          if kw.arg=='json' and isinstance(kw.value,ast.Dict):
                              for i,key in enumerate(kw.value.keys):
                                  if isinstance(key,ast.Constant) and key.value=='link_preview_options':
                                      kw.value.values[i]=ast.parse(
                                          '_market_preview(message)',
                                          mode='eval'
                                      ).body

              tree.body=ast.parse(PREVIEW).body+tree.body
              return ast.unparse(ast.fix_missing_locations(tree))+'\n'

          def update(source):
              if '# market-layout-v4' in source:
                  return source

              for delimiter,func in [
                  ('PYPROVIDER',patch_provider),
                  ('PYLAYOUT',patch_layout),
                  ('PYMAIN',patch_main)
              ]:
                  pattern=r"(?m)(^[ ]*(?:cat > [^\n]+|python -) <<'"+delimiter+r"'\n)(.*?)(^[ ]*"+delimiter+r"[ ]*$)"
                  match=re.search(pattern,source,re.S)

                  if not match:
                      raise ValueError('수정 대상 코드 없음: '+delimiter)

                  code=func(textwrap.dedent(match[2]))
                  compile(code,delimiter,'exec')

                  indent=re.match(r' *',match[3])[0]

                  source=(
                      source[:match.start(2)]
                      +textwrap.indent(code,indent)
                      +source[match.end(2):]
                  )

              return source+'\n# market-layout-v4\n'

          if __name__=='__main__':
              import sys,yaml

              original=Path(sys.argv[1]).read_text(encoding='utf-8')
              result=update(original)
              yaml.safe_load(result)

              destination=Path(sys.argv[2])
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_text(result,encoding='utf-8')

              print('수정본 생성 완료:',destination)
          PYUPDATE

      - uses: actions/upload-artifact@v4
        with:
          name: market-briefing-updated
          path: artifact/market-briefing.yml
          retention-days: 7
          overwrite: true
