              eastern_confirmed = bool(re.search('(all times|times shown).*eastern', soup.get_text(' ', strip=True), re.I))
              rows = []
              for table in tables:
                  heading = table.select_one('thead')
                  year = re.search('Year\\s+(20\\d{2})', heading.get_text(' ', strip=True) if heading else '')
                  if not year:
                      continue
                  for item in table.select('tbody tr'):
                      date_node, title_node = (item.select_one('.release-date'), item.select_one('.release-title'))
